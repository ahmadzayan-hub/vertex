name: CI

on:
  push:
    branches: [main, "improvement/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Typecheck · Lint · Unit Tests · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        # next lint removed in Next.js 16; script now calls eslint directly

      - name: Unit tests
        run: npm run test
        env:
          AI_PROVIDER: mock

      - name: Production build
        run: npm run build
        env:
          AI_PROVIDER: mock
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build
        env:
          AI_PROVIDER: mock
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          AI_PROVIDER: mock
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          PLAYWRIGHT_CHROMIUM_PATH: ""

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
